<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaptan Qedy · OBS Yayın Katmanı</title>
<style>
  :root{
    --bg:#07090d;--ink:#f4f7fa;--muted:#9aa7b6;--blue:#22aef0;--pink:#ff3d7f;--twitch:#9146ff;--kick:#53fc18;--edge:rgba(214,240,255,.22);
    --font-display:'Unbounded',system-ui,sans-serif;
    --font-body:'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
    font-family:var(--font-body);color:var(--ink)
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
  body{user-select:none}
  .overlay{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate}
  .overlay:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,9,13,.72),transparent 14%,transparent 86%,rgba(7,9,13,.72));opacity:.38}
  .preview .overlay{background:url("preview-assets/game-scene.png") center/cover no-repeat}
  .topline{position:absolute;left:2.1%;right:2.1%;top:3%;height:1px;background:linear-gradient(90deg,var(--twitch),rgba(34,174,240,.45) 36%,rgba(255,61,127,.45) 65%,var(--kick));box-shadow:0 0 18px rgba(34,174,240,.55)}
  .corner{position:absolute;width:3.8%;height:6.5%;border-color:var(--edge);border-style:solid;opacity:.65}
  .corner.tl{top:3%;left:2.1%;border-width:2px 0 0 2px}.corner.tr{top:3%;right:2.1%;border-width:2px 2px 0 0}.corner.bl{bottom:3%;left:2.1%;border-width:0 0 2px 2px}.corner.br{bottom:3%;right:2.1%;border-width:0 2px 2px 0}
  .port{position:absolute;top:4.2%;display:flex;align-items:center;gap:.65vw;font-family:var(--font-mono);font-size:.72vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 20px currentColor}
  .port:before{content:"";width:.44vw;height:.44vw;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor;animation:beacon 2.8s ease-in-out infinite}
  .port.twitch{left:4.2%;color:var(--twitch)}.port.kick{right:4.2%;color:var(--kick);flex-direction:row-reverse}
  .port span{color:var(--ink)}
  .rail{position:absolute;top:13%;bottom:14%;width:2px;opacity:.7}.rail.left{left:2.1%;background:linear-gradient(transparent,var(--twitch),transparent)}.rail.right{right:2.1%;background:linear-gradient(transparent,var(--kick),transparent)}
  .rail:after{content:"";position:absolute;left:-3px;top:0;width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 18px currentColor;animation:travel 12s linear infinite}.rail.left{color:var(--twitch)}.rail.right{color:var(--kick)}.rail.right:after{animation-delay:-6s}
  .preview-webcam{display:none;position:absolute;left:5.2%;bottom:10.5%;height:28%;width:auto;max-width:18%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 12px 26px rgba(0,0,0,.6))}
  .preview .preview-webcam{display:block}
  .preview-tag{display:none;position:absolute;left:5%;bottom:38.8%;padding:.3vw .55vw;background:rgba(7,9,13,.76);border-radius:.25vw;color:#d8e3ea;font-size:.53vw;letter-spacing:.12em;text-transform:uppercase}
  .preview .preview-tag{display:block}
  .camera-bar{position:absolute;left:4.1%;bottom:8.3%;width:18.5%;height:3.6%;display:flex;align-items:center;gap:.65vw;padding:0 .95vw;border-left:3px solid var(--blue);border-top:1px solid rgba(34,174,240,.5);border-bottom:1px solid rgba(255,61,127,.45);border-radius:.3vw .75vw .75vw .3vw;background:linear-gradient(90deg,rgba(7,9,13,.68),rgba(14,24,35,.48) 72%,rgba(7,9,13,.12));box-shadow:0 12px 28px rgba(0,0,0,.35),0 0 20px rgba(34,174,240,.13);font-family:var(--font-display);font-size:.58vw;font-weight:700;letter-spacing:.03em}
  .camera-logo{width:1.65vw;height:1.65vw;flex:none;border-radius:50%;object-fit:cover;opacity:.78;box-shadow:0 0 12px rgba(34,174,240,.35);animation:logoFloat 6s ease-in-out infinite}
  .camera-bar small{margin-left:auto;font-family:var(--font-mono);color:var(--pink);font-size:.49vw;letter-spacing:.2em}
  .chat{position:absolute;right:4.1%;bottom:8.3%;width:15%;height:52%;border:1px solid rgba(214,240,255,.19);border-radius:1.25vw;background:linear-gradient(180deg,rgba(8,12,19,.58),rgba(8,12,19,.34));box-shadow:0 15px 40px rgba(0,0,0,.16),0 0 20px rgba(34,174,240,.06);overflow:hidden;display:flex;flex-direction:column}
  .messages{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.48vw;padding:1vw 1.05vw 1.15vw;overflow:hidden;mask-image:linear-gradient(transparent,#000 11%,#000)}
  .message{min-width:0;padding:.56vw .66vw;background:rgba(7,9,13,.66);border-left:2px solid var(--platform);border-radius:.35vw .55vw .55vw .35vw;animation:messageIn .45s ease-out both;overflow-wrap:anywhere}
  .message .meta{display:flex;align-items:center;gap:.46vw;margin-bottom:.28vw;font-size:.61vw;font-weight:700}
  .message .badge{font-family:var(--font-mono);font-size:.44vw;letter-spacing:.1em;color:var(--platform);border:1px solid var(--platform);border-radius:.22vw;padding:.11vw .27vw}
  .message .name{color:var(--platform)}
  .message .body{font-size:.72vw;font-weight:400;line-height:1.4;color:#e3ebf2}
  .message .body .emote{height:1.6em;width:auto;vertical-align:middle;margin:-.2em .08em}
  .lower{position:absolute;bottom:3%;left:4.15%;right:4.15%;display:flex;align-items:center;gap:1vw;font-family:var(--font-mono);font-size:.58vw;letter-spacing:.16em;text-transform:uppercase;color:#a8b7c6}
  .lower .line{height:1px;flex:1;background:linear-gradient(90deg,rgba(34,174,240,.65),rgba(255,61,127,.65),rgba(83,252,24,.65))}
  .alert{position:absolute;top:12.5%;width:23%;min-height:10%;transform:translateY(-1vw) scale(.94);opacity:0;pointer-events:none;display:flex;align-items:center;gap:.8vw;padding:.85vw 1.05vw;border:1px solid var(--accent);border-radius:.8vw;background:linear-gradient(120deg,rgba(8,15,24,.93),rgba(22,18,29,.9));box-shadow:0 18px 45px rgba(0,0,0,.48),0 0 28px color-mix(in srgb,var(--accent) 24%,transparent);transition:transform .5s cubic-bezier(.2,1.4,.3,1),opacity .3s;z-index:5}
  .alert.twitch{left:4.1%;--accent:var(--twitch)}.alert.kick{right:4.1%;--accent:var(--kick)}
  .alert.show{transform:translateY(0) scale(1);opacity:1}
  .alert:before{content:"";position:absolute;inset:-3px;border-radius:inherit;border:1px solid var(--accent);animation:alertPulse 2s ease-out infinite}
  .alert-logo{width:3.5vw;height:3.5vw;flex:none;border-radius:50%;object-fit:cover;border:2px solid var(--accent);box-shadow:0 0 15px var(--accent)}
  .alert-content{min-width:0}.alert-eyebrow{font-family:var(--font-mono);font-size:.52vw;font-weight:600;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.alert-name{display:block;margin:.3vw 0;font-family:var(--font-display);font-size:.92vw;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.alert-line{font-size:.65vw;color:#cbd5df}
  .preview-tools{display:none;position:absolute;top:14%;left:4.1%;z-index:10;gap:.45vw;padding:.65vw;border-radius:.6vw;background:rgba(7,9,13,.9);border:1px solid rgba(245,247,250,.25)}
  .demo .preview-tools{display:flex}.preview-tools button{font:700 .6vw system-ui;color:white;background:#17212d;border:1px solid #4b667b;border-radius:.3vw;padding:.5vw .65vw;cursor:pointer}
  .preview-tools button:hover{border-color:var(--blue)}
  .preview-status{display:none;position:absolute;top:19%;left:4.1%;padding:.4vw .6vw;border-radius:.3vw;background:rgba(7,9,13,.85);color:var(--muted);font-size:.55vw}.demo .preview-status{display:block}
  @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-.28vw) rotate(4deg)}}
  @keyframes beacon{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.65)}}
  @keyframes travel{0%{top:0;opacity:0}6%{opacity:1}94%{opacity:1}100%{top:100%;opacity:0}}
  @keyframes glint{0%,72%,100%{left:-40%}82%{left:130%}}
  @keyframes messageIn{from{opacity:0;transform:translateY(.7vw)}to{opacity:1;transform:translateY(0)}}
  @keyframes alertPulse{from{opacity:.65;transform:scale(1)}to{opacity:0;transform:scale(1.08)}}
  @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="show.css">
</head>
<body>
<div class="overlay" aria-label="Kaptan Qedy yayın katmanı">
  <div class="topline"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <div class="rail left"></div><div class="rail right"></div>
  <div class="port twitch"><span>TWITCH</span></div><div class="port kick"><span>KICK</span></div>
  <img class="preview-webcam" src="preview-assets/webcam-standin.png" alt="Temsili kamera görüntüsü">
  <div class="preview-tag">Temsili kamera</div>
  <div class="camera-bar" aria-label="Kamera alt yazısı"><img class="camera-logo" src="../docs/assets/logo_cat.png" alt=""><span>KAPTAN QEDY</span><small>CANLI</small></div>
  <div class="chat" aria-label="Ortak sohbet"><div class="messages" id="messages" role="log" aria-live="polite"></div></div>
  <div class="alert twitch" id="alertTwitch" aria-live="polite"><img class="alert-logo" src="../docs/assets/logo_cat.png" alt=""><div class="alert-content"><div class="alert-eyebrow">TWITCH · YENİ TAKİP</div><strong class="alert-name"></strong><div class="alert-line">Mürettebata hoş geldin!</div></div></div>
  <div class="alert kick" id="alertKick" aria-live="polite"><img class="alert-logo" src="../docs/assets/logo_cat.png" alt=""><div class="alert-content"><div class="alert-eyebrow">KICK · YENİ TAKİP</div><strong class="alert-name"></strong><div class="alert-line">Mürettebata hoş geldin!</div></div></div>
  <div class="lower"><span class="line"></span><span>AYNI YAYIN · TEK MÜRETTEBAT</span></div>
  <div class="preview-tools"><button id="demoTwitch">Twitch mesajı</button><button id="demoKick">Kick mesajı</button><button id="demoFollow">Twitch takip</button><button id="demoKickFollow">Kick takip</button><button id="demoBits">Twitch bit</button><button id="demoSub">Twitch abone</button><button id="demoKickSub">Kick abone</button></div>
  <div class="preview-status" id="previewStatus">Canlı bağlantı bekleniyor</div>
</div>
<script src="emotes.js"></script>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const demo = params.has('demo');
  const sample = params.has('sample');
  if (demo) document.documentElement.classList.add('demo');
  if (sample) document.documentElement.classList.add('preview');
  const messages = document.getElementById('messages');
  const alerts = { twitch: document.getElementById('alertTwitch'), kick: document.getElementById('alertKick') };
  const colors = { twitch: '#9146ff', kick: '#53fc18' };
  const maxMessages = 7;
  const alertQueues = { twitch: [], kick: [] };
  const alertBusy = { twitch: false, kick: false };
  let audioContext;

  function safeText(value, limit = 180) { return String(value ?? '').replace(/[\u0000-\u001f\u007f]/g, '').slice(0, limit); }
  function addChat(event) {
    const platform = String(event.platform || '').toLowerCase();
    if (!colors[platform]) return;
    const name = safeText(event.name || event.user, 32);
    const parts = event.parts || qedyEmotes.parse(null, safeText(event.text || event.message, 240));
    if (!name || !qedyEmotes.hasContent(parts)) return;
    const item = document.createElement('div');
    item.className = 'message';
    item.style.setProperty('--platform', colors[platform]);
    const meta = document.createElement('div'); meta.className = 'meta';
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = platform.toUpperCase();
    const username = document.createElement('span'); username.className = 'name'; username.textContent = name;
    const rank = window.qedyRanks?.get(`${platform}:${name.toLocaleLowerCase('tr-TR')}`);
    if (rank) { const r = document.createElement('small'); r.className = 'crew-rank'; r.textContent = rank; username.append(r); }
    const content = document.createElement('div'); content.className = 'body'; qedyEmotes.render(content, parts, 240);
    meta.append(badge, username); item.append(meta, content); messages.append(item);
    while (messages.children.length > maxMessages) messages.firstElementChild.remove();
  }
  function chime() {
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();
      const now = audioContext.currentTime;
      [440, 554.37, 659.25].forEach((frequency, i) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = 'sine'; oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(0.0001, now + i * .095);
        gain.gain.exponentialRampToValueAtTime(.085, now + i * .095 + .015);
        gain.gain.exponentialRampToValueAtTime(.0001, now + i * .095 + .34);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(now + i * .095); oscillator.stop(now + i * .095 + .35);
      });
    } catch (_) { /* Visual alert still works if audio is unavailable. */ }
  }
  function playNextAlert(platform) {
    const event = alertQueues[platform].shift();
    if (!event) { alertBusy[platform] = false; return; }
    alertBusy[platform] = true;
    const card = alerts[platform];
    const labels = { follow: 'YENİ TAKİP', subscription: 'YENİ ABONE', bits: 'BİT DESTEĞİ', kicks: 'KICKS DESTEĞİ' };
    const amount = Number(event.amount);
    const hasAmount = Number.isFinite(amount) && amount > 0;
    const lines = {
      follow: 'Mürettebata hoş geldin!',
      subscription: 'Aramıza katıldı!',
      bits: hasAmount ? amount.toLocaleString('tr-TR') + ' bit gönderdi!' : 'Bit gönderdi!',
      kicks: hasAmount ? amount.toLocaleString('tr-TR') + ' Kicks gönderdi!' : 'Kicks gönderdi!'
    };
    card.querySelector('.alert-eyebrow').textContent = platform.toUpperCase() + ' · ' + labels[event.type];
    card.querySelector('.alert-name').textContent = event.name;
    card.querySelector('.alert-line').textContent = lines[event.type];
    card.classList.add('show');
    chime();
    setTimeout(() => {
      card.classList.remove('show');
      setTimeout(() => playNextAlert(platform), 450);
    }, 5500);
  }
  function showAlert(event) {
    const platform = String(event.platform || '').toLowerCase();
    if (!alerts[platform]) return;
    const name = safeText(event.name || event.user || (event.type === 'bits' ? 'Anonim' : ''), 40);
    if (!name) return;
    const queue = alertQueues[platform];
    if (queue.length >= 10) queue.shift();
    queue.push({ type: event.type, name, amount: event.amount });
    if (!alertBusy[platform]) playNextAlert(platform);
  }
  function push(event) {
    if (!event || typeof event !== 'object') return;
    if (event.type === 'chat') addChat(event);
    if (['follow','subscription','bits','kicks'].includes(event.type)) showAlert(event);
  }
  window.qedyOverlay = Object.freeze({ push });
  window.addEventListener('qedy-overlay-event', e => push(e.detail));

  // Streamer.bot runs locally and combines Twitch and Kick events.
  // Its default WebSocket server listens on 127.0.0.1:8080.
  function fromStreamerBot(payload) {
    const source = String(payload?.event?.source || '').toLowerCase();
    const type = String(payload?.event?.type || '');
    const data = payload?.data || {};
    if (!colors[source]) return;
    if (type === 'ChatMessage') {
      push({type:'chat', platform:source, name:data.user?.name || data.user?.login, text:data.text, parts:qedyEmotes.parse(data)});
    } else if (type === 'Follow') {
      const follower = source === 'twitch' ? data.targetUser : data.user;
      push({type:'follow', platform:source, name:follower?.name || follower?.login});
    } else if (['Sub','ReSub','Subscription','Resubscription','GiftSub','GiftSubscription'].includes(type)) {
      push({type:'subscription', platform:source, name:data.user?.name || data.user?.login || data.recipient?.name || data.recipient?.login});
    } else if (source === 'twitch' && type === 'Cheer') {
      push({type:'bits', platform:source, name:data.user?.name || data.user?.login || 'Anonim', amount:data.bits});
    } else if (source === 'kick' && type === 'KicksGifted') {
      push({type:'kicks', platform:source, name:data.user?.name || data.user?.login || data.sender?.name, amount:data.kicks?.amount || data.amount});
    }
  }
  const status = document.getElementById('previewStatus');
  function connectStreamerBot() {
    let socket;
    try { socket = new WebSocket('ws://127.0.0.1:8080/'); }
    catch (_) { setTimeout(connectStreamerBot, 3000); return; }
    socket.addEventListener('open', () => {
      status.textContent = 'Streamer.bot bağlı · Twitch + Kick bekleniyor';
      socket.send(JSON.stringify({request:'Subscribe',id:'qedy-overlay',events:{Twitch:['ChatMessage','Follow','Sub','ReSub','GiftSub','Cheer'],Kick:['ChatMessage','Follow','Subscription','Resubscription','GiftSubscription','KicksGifted']}}));
    });
    socket.addEventListener('message', e => { try { fromStreamerBot(JSON.parse(e.data)); } catch (_) {} });
    socket.addEventListener('close', () => { status.textContent = 'Canlı bağlantı bekleniyor'; setTimeout(connectStreamerBot, 3000); });
  }
  connectStreamerBot();
  if (demo) {
    document.getElementById('demoTwitch').onclick = () => fromStreamerBot({event:{source:'Twitch',type:'ChatMessage'},data:{user:{name:'MaviKaptan'},text:'Selam mürettebat! Yayın çok iyi görünüyor ⚓'}});
    document.getElementById('demoKick').onclick = () => fromStreamerBot({event:{source:'Kick',type:'ChatMessage'},data:{user:{name:'YesilLiman'},text:'Kick tarafı da burada, iki liman tek chat!'}});
    document.getElementById('demoFollow').onclick = () => fromStreamerBot({event:{source:'Twitch',type:'Follow'},data:{targetUser:{name:'YeniMurettebat'}}});
    document.getElementById('demoKickFollow').onclick = () => fromStreamerBot({event:{source:'Kick',type:'Follow'},data:{user:{name:'KickMurettebat'}}});
    document.getElementById('demoBits').onclick = () => fromStreamerBot({event:{source:'Twitch',type:'Cheer'},data:{user:{name:'MaviDestekci'},bits:250}});
    document.getElementById('demoSub').onclick = () => fromStreamerBot({event:{source:'Twitch',type:'Sub'},data:{user:{name:'YeniAbone'}}});
    document.getElementById('demoKickSub').onclick = () => fromStreamerBot({event:{source:'Kick',type:'Subscription'},data:{user:{name:'YesilAbone'}}});
  }
  if (sample) setTimeout(() => {  // after show-client.js has shared crew ranks
    fromStreamerBot({event:{source:'Twitch',type:'ChatMessage'},data:{user:{name:'MaviKaptan'},text:'Selam mürettebat! Kappa Yayın çok iyi görünüyor ⚓',emotes:[{name:'Kappa',imageUrl:'https://static-cdn.jtvnw.net/emoticons/v2/25/default/dark/2.0'}]}});
    fromStreamerBot({event:{source:'Kick',type:'ChatMessage'},data:{user:{name:'YesilLiman'},text:'Kick tarafı da burada [emote:37226:KEKW] iki liman tek chat!'}});
    fromStreamerBot({event:{source:'Twitch',type:'Cheer'},data:{user:{name:'MaviDestekci'},bits:250}});
    fromStreamerBot({event:{source:'Kick',type:'Subscription'},data:{user:{name:'YesilAbone'}}});
  }, 150);
})();
</script>
<script src="motion.js"></script><script src="show-client.js"></script></body>
</html>
