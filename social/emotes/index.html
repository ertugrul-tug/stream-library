<!doctype html>
<!-- Emote drafts (SVG) for Twitch/Kick, based on the logo cat. Twitch wants 112/56/28 px PNGs with a transparent
     background; this page shows every draft at those sizes on dark and light chat backgrounds.
     A final version should be redrawn by a designer (or traced over) — these fix the idea and the silhouettes. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emote Taslakları</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap">
<style>
  :root{--bg:#07090d;--surface:#0f131a;--line:rgba(245,247,250,.09);--ink:#f4f7fa;--dim:#9aa7b6}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
  main{max-width:980px;margin:0 auto;padding:40px 16px 60px}
  h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(24px,5vw,38px);margin:0 0 6px}
  p.lead{color:var(--dim);margin:0 0 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
  .card h2{font-size:15px;margin:0 0 2px}.card small{color:var(--dim)}
  .sizes{display:flex;align-items:flex-end;gap:12px;margin:16px 0 10px}
  .chat{display:flex;align-items:center;gap:6px;border-radius:8px;padding:6px 10px;font-size:13px}
  .chat.dark{background:#18181b;color:#efeff1}.chat.light{background:#fff;color:#0e0e10;margin-top:6px}
  svg{display:block;overflow:visible}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- Head without eyes; 112×112, transparent. White outline keeps the black cat readable on dark chat. -->
    <g id="head">
      <path d="M22 60 C12 34 38 16 56 16 C74 16 100 34 90 60" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 60 C12 34 38 16 56 16 C74 16 100 34 90 60" fill="none" stroke="#1b1b1f" stroke-width="5" stroke-linecap="round"/>
      <g stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">
        <path d="M25 50 L29 16 L51 33Z" fill="#1b1b1f"/><path d="M87 50 L83 16 L61 33Z" fill="#1b1b1f"/>
        <path d="M18 60 C18 38 36 29 56 29 C76 29 94 38 94 60 C94 83 77 96 56 96 C35 96 18 83 18 60Z" fill="#1b1b1f"/>
      </g>
      <path d="M31 42 L33 23 L45 34Z" fill="#e6e6ea"/><path d="M81 42 L79 23 L67 34Z" fill="#e6e6ea"/>
      <path d="M28 72 C32 60 43 57 50 61 L56 51 L62 61 C69 57 80 60 84 72 C82 86 69 94 56 94 C43 94 30 86 28 72Z" fill="#ececef"/>
      <path d="M52.5 67 L59.5 67 L56 71Z" fill="#f4a3b6" stroke="#1b1b1f" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M49 75 Q52.5 78.5 56 74 Q59.5 78.5 63 75" fill="none" stroke="#1b1b1f" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M51.8 76.6 L53 81 L54.8 77.4" fill="#fff" stroke="#1b1b1f" stroke-width="1" stroke-linejoin="round"/>
      <g stroke="#fff" stroke-width="3" paint-order="stroke">
        <rect x="9" y="50" width="14" height="26" rx="6" fill="#1b1b1f"/><rect x="89" y="50" width="14" height="26" rx="6" fill="#1b1b1f"/>
      </g>
      <path d="M18 74 Q24 92 43 90" fill="none" stroke="#1b1b1f" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="44.5" cy="90" r="3" fill="#1b1b1f"/>
    </g>
    <g id="eyes">
      <path d="M29 58 Q37 49 48 56.5 Q40 64.5 29 58Z" fill="#fff"/><path d="M83 58 Q75 49 64 56.5 Q72 64.5 83 58Z" fill="#fff"/>
      <circle cx="41" cy="57.5" r="3.6" fill="#1b1b1f"/><circle cx="71" cy="57.5" r="3.6" fill="#1b1b1f"/>
      <path d="M30 49 L46 53" stroke="#ececef" stroke-width="3.4" stroke-linecap="round"/><path d="M82 49 L66 53" stroke="#ececef" stroke-width="3.4" stroke-linecap="round"/>
    </g>
    <g id="happy"><!-- closed ^^ eyes -->
      <path d="M30 59 Q38 49 47 58" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M65 58 Q74 49 82 59" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="shock"><!-- wide eyes, tiny pupils -->
      <ellipse cx="39" cy="57" rx="9" ry="7.5" fill="#fff"/><ellipse cx="73" cy="57" rx="9" ry="7.5" fill="#fff"/>
      <circle cx="39" cy="57" r="2.2" fill="#1b1b1f"/><circle cx="73" cy="57" r="2.2" fill="#1b1b1f"/>
    </g>
  </defs>
</svg>

<main>
  <h1>Emote taslakları</h1>
  <p class="lead">Logodaki kediden dört fikir. Her biri 112 / 56 / 28 piksel ve sohbet arka planında. Asıl önemli olan 28 px'te okunabilmesi.</p>
  <div class="grid" id="grid"></div>
</main>

<template id="emote-selam">
  <use href="#head"></use><use href="#eyes"></use>
  <g transform="rotate(-28 88 40)" stroke="#1b1b1f" stroke-width="2.2">
    <rect x="76" y="31" width="25" height="18" rx="9" fill="#ececef"></rect>
    <path d="M83 33 V41 M89 32.5 V41 M95 33 V41" fill="none" stroke-width="1.6" stroke-linecap="round"></path>
  </g>
</template>
<template id="emote-balik">
  <use href="#head"></use><use href="#eyes"></use>
  <g stroke="#0d3d5c" stroke-width="2" stroke-linejoin="round">
    <path d="M40 81 C48 72 66 72 74 81 C66 90 48 90 40 81Z" fill="#22aef0"></path>
    <path d="M74 81 L88 72 L85 81 L88 90Z" fill="#22aef0"></path>
  </g>
  <circle cx="47" cy="80" r="1.8" fill="#0d3d5c"></circle>
</template>
<template id="emote-kraken">
  <use href="#head"></use><use href="#shock"></use>
  <g fill="none" stroke="#ff3d7f" stroke-width="8" stroke-linecap="round">
    <path d="M6 110 C4 86 22 80 30 92 C35 100 26 107 22 99"></path><path d="M106 110 C108 86 90 80 82 92 C77 100 86 107 90 99"></path>
  </g>
  <g fill="#ffd0de"><circle cx="10" cy="96" r="1.8"></circle><circle cx="17" cy="86" r="1.8"></circle><circle cx="102" cy="96" r="1.8"></circle><circle cx="95" cy="86" r="1.8"></circle></g>
</template>
<template id="emote-gg">
  <use href="#head"></use><use href="#happy"></use>
  <g transform="rotate(-8 84 92)">
    <rect x="60" y="78" width="48" height="28" rx="9" fill="#ffce54" stroke="#1b1b1f" stroke-width="3"></rect>
    <text x="84" y="99" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="900" font-size="19" fill="#1b1b1f">GG</text>
  </g>
</template>

<script>
  const EMOTES = [
    ['selam', 'qedySelam', 'Kaptan selamı: karşılama, "güverteye hoş geldin"'],
    ['balik', 'qedyBalik', 'Ağzında balık: olta, ganimet, "yakaladım"'],
    ['kraken', 'qedyKraken', 'Kraken saldırısı: panik, sürpriz, "ne oluyor"'],
    ['gg', 'qedyGG', 'Mutlu GG: maç sonu, galibiyet, "iyi oyundu"'],
  ];
  const ns = 'http://www.w3.org/2000/svg';
  const make = (id, px) => {
    const s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 112 112'); s.setAttribute('width', px); s.setAttribute('height', px);
    s.setAttribute('role', 'img'); s.innerHTML = document.getElementById('emote-' + id).innerHTML; return s;
  };
  const grid = document.getElementById('grid');
  EMOTES.forEach(([id, code, note]) => {
    const c = document.createElement('div'); c.className = 'card';
    const h = document.createElement('h2'); h.textContent = code; const sm = document.createElement('small'); sm.textContent = note;
    const sizes = document.createElement('div'); sizes.className = 'sizes'; [112, 56, 28].forEach(px => sizes.append(make(id, px)));
    const line = cls => { const d = document.createElement('div'); d.className = 'chat ' + cls; d.append('MaviKaptan: güverteye geldim', make(id, 28)); return d; };
    c.append(h, sm, sizes, line('dark'), line('light')); grid.append(c);
  });
</script>
</body>
</html>
