<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaptan Qedy · Canlı İzle</title>
<meta name="description" content="Kaptan Qedy canlı yayını: Twitch ya da Kick oynatıcısı ve iki platformun ortak sohbeti.">
<link rel="icon" href="../assets/logo_cat.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root{
    color-scheme: dark;
    --bg:#07090d; --surface:#0f131a; --surface-2:#151b24;
    --line:rgba(245,247,250,.09); --line-strong:rgba(245,247,250,.18);
    --ink:#f4f7fa; --ink-dim:#9aa7b6; --ink-faint:#5f6b79;
    --twitch:#9146ff; --kick:#53fc18; --pink:#ff3d7f; --blue:#22aef0;
    --font-display:'Unbounded',system-ui,sans-serif;
    --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'JetBrains Mono',Consolas,monospace;
    --head:56px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
  a{color:inherit}
  button{font-family:inherit}
  header{height:var(--head);display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(7,9,13,.92)}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:800;font-size:14px;letter-spacing:.08em;white-space:nowrap}
  .brand img{width:30px;height:30px;border-radius:50%}
  .live{display:none;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:var(--pink)}
  .live.on{display:inline-flex}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  @media (prefers-reduced-motion: reduce){.live i{animation:none}}
  .spacer{flex:1}
  .switch{display:flex;border:1px solid var(--line-strong);border-radius:999px;overflow:hidden}
  .switch button{border:0;background:transparent;color:var(--ink-dim);font-weight:700;font-size:12px;padding:8px 14px;cursor:pointer}
  .switch button[aria-pressed="true"][data-p="twitch"]{background:var(--twitch);color:#fff}
  .switch button[aria-pressed="true"][data-p="kick"]{background:var(--kick);color:#0b1200}
  .home{font-size:13px;color:var(--ink-dim);text-decoration:none;white-space:nowrap}
  .home:hover{color:var(--ink)}

  main{display:grid;grid-template-columns:1fr minmax(300px,380px);height:calc(100dvh - var(--head))}
  .stage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:0;padding:16px;gap:12px}
  .player{position:relative;width:100%;max-width:calc((100dvh - var(--head) - 80px) * 16 / 9);aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line-strong);background:#000}
  .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .note{font-size:13px;color:var(--ink-dim);text-align:center;line-height:1.6;margin:0}

  .chat{display:flex;flex-direction:column;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--ink-dim)}
  .conn{margin-left:auto;display:flex;gap:6px}
  .conn span{display:inline-flex;align-items:center;gap:5px;letter-spacing:.06em;font-size:10px;color:var(--ink-faint)}
  .conn span::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
  .conn span.on.t::before{background:var(--twitch)} .conn span.on.k::before{background:var(--kick)}
  .conn span.on{color:var(--ink-dim)}
  .msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;overscroll-behavior:contain}
  .msg{padding:5px 2px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
  .msg .pf{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:-3px;margin-right:6px;font:800 10px/16px var(--font-mono);text-align:center}
  .msg .pf.twitch{background:var(--twitch);color:#fff} .msg .pf.kick{background:var(--kick);color:#0b1200}
  .msg .who{font-weight:700}
  .msg .cap{font-size:10px;font-weight:800;letter-spacing:.06em;color:#0b1200;background:var(--blue);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:1px}
  .msg img.emote{height:24px;vertical-align:-7px;margin:0 1px}
  .msg.mine{background:rgba(145,70,255,.08);border-radius:6px;padding-left:6px}
  .empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:24px 8px;line-height:1.6}
  .jump{display:none;margin:0 12px 8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .jump.on{display:block}

  .compose{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .send-row{display:flex;gap:8px}
  .send-row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;color:var(--ink);font:500 14px var(--font-body);padding:10px 12px}
  .send-row input:focus{outline:2px solid var(--twitch);outline-offset:0;border-color:transparent}
  .btn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px;cursor:pointer;text-decoration:none;text-align:center;white-space:nowrap}
  .btn.twitch{background:var(--twitch);border-color:var(--twitch);color:#fff}
  .btn.kick{background:transparent;border-color:var(--kick);color:var(--kick)}
  .btn:disabled{opacity:.5;cursor:default}
  /* only Kick's compose row: its popout chat is bottom-anchored, so a tall iframe pinned to the bottom of a short box crops to it */
  .kickbox{position:relative;height:104px;margin-bottom:8px;overflow:hidden;border-radius:8px;background:#0e0e10}
  .kickbox iframe{position:absolute;left:0;bottom:0;width:100%;height:420px;border:0}
  .kickbox.open{position:fixed;inset:4vh 4vw;height:auto;max-width:520px;margin:0 auto;z-index:50;box-shadow:0 0 0 100vmax rgba(0,0,0,.75)}
  .kickbox.open iframe{height:100%}
  .kickbox .bar{position:absolute;top:4px;left:4px;z-index:1;display:flex;align-items:center;gap:6px;max-width:calc(100% - 48px)}
  .kickbox .bar .btn{padding:4px 10px;font-size:12px;background:var(--kick);border-color:var(--kick);color:#000}
  .kickbox .hint{display:none;font-size:12px;font-weight:600;color:#fff;background:rgba(0,0,0,.7);border-radius:6px;padding:3px 8px}
  .kickbox.open .hint{display:block}
  .login-row{display:flex;gap:8px}
  .login-row .btn{flex:1}
  .who-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-dim)}
  .who-row b{color:var(--ink)}
  .who-row button{margin-left:auto;background:none;border:0;color:var(--ink-faint);font-size:12px;cursor:pointer;text-decoration:underline}
  .status{font-size:12px;color:var(--ink-dim);min-height:0}
  .status.err{color:#ff8a93}
  .msg .av{width:22px;height:22px;border-radius:50%;vertical-align:-6px;margin-right:6px;background:var(--surface-2);object-fit:cover}
  .msg .pf{margin-right:4px}
  .emote-btn{flex:none;width:42px;padding:0;font-size:18px}
  .picker{border:1px solid var(--line-strong);background:var(--surface-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;max-height:260px}
  .picker input{background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;color:var(--ink);font:500 13px var(--font-body);padding:7px 10px}
  .picker .grid{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0}
  .picker h4{margin:2px 0 0;font:500 10px var(--font-mono);letter-spacing:.12em;color:var(--ink-faint)}
  .picker .set{display:flex;flex-wrap:wrap;gap:2px}
  .picker .set button{width:36px;height:36px;border:0;border-radius:6px;background:transparent;cursor:pointer;padding:3px}
  .picker .set button:hover,.picker .set button:focus-visible{background:rgba(145,70,255,.25);outline:none}
  .picker .set img{width:28px;height:28px;object-fit:contain}
  .picker .hint{font-size:12px;color:var(--ink-faint);text-align:center;padding:10px}
  [hidden]{display:none!important}

  @media (max-width: 900px){
    :root{--head:52px}
    header{gap:8px;padding:0 12px}
    .brand span{display:none}
    main{display:flex;flex-direction:column;height:calc(100dvh - var(--head))}
    .stage{padding:0;gap:0;flex:none}
    .player{border-radius:0;border-left:0;border-right:0;max-width:none}
    .note{display:none}
    .chat{flex:1;border-left:0}
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="../"><img src="../assets/logo_cat.png" alt=""><span>KAPTAN&nbsp;QEDY</span></a>
  <span class="live" id="live"><i></i>CANLI</span>
  <span class="spacer"></span>
  <div class="switch" role="group" aria-label="Yayın">
    <button type="button" data-p="twitch" aria-pressed="true">Twitch</button>
    <button type="button" data-p="kick" aria-pressed="false">Kick</button>
  </div>
  <a class="home" href="../">← Site</a>
</header>
<main>
  <section class="stage">
    <div class="player" id="player"></div>
    <p class="note">Yayın Twitch ve Kick'te aynı anda · sağdaki sohbet ikisinin ortak akışı</p>
  </section>
  <section class="chat" aria-label="Ortak sohbet">
    <div class="chat-head">ORTAK SOHBET
      <div class="conn"><span class="t" id="connT">TWITCH</span><span class="k" id="connK">KICK</span></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"><p class="empty" id="empty">Twitch ve Kick sohbeti burada birleşiyor. İlk mesaj bekleniyor…</p></div>
    <button type="button" class="jump" id="jump">↓ Yeni mesajlar</button>
    <div class="compose">
      <div class="who-row" id="whoRow" hidden><span>Twitch olarak yazıyorsun: <b id="whoName"></b></span><button type="button" id="logout">Çıkış</button></div>
      <div class="picker" id="picker" hidden>
        <input id="emoteSearch" placeholder="Emote ara…" aria-label="Emote ara" autocomplete="off">
        <div class="grid" id="emoteGrid"></div>
      </div>
      <div class="send-row" id="sendRow" hidden>
        <button type="button" class="btn emote-btn" id="emoteBtn" aria-label="Emote seç" title="Emote seç">😀</button>
        <input id="text" maxlength="450" autocomplete="off" placeholder="Mesajını yaz…" aria-label="Mesaj">
        <button type="button" class="btn twitch" id="send">Gönder</button>
      </div>
      <div class="kickbox" id="kickBox" hidden><div class="bar"><button type="button" class="btn" id="kickGrow"></button><button type="button" class="btn" id="kickClose" aria-label="Kapat">Kapat</button><span class="hint">Giriş yaptıktan sonra “Küçült”e bas</span></div></div>
      <div class="login-row" id="loginRow">
        <button type="button" class="btn twitch" id="login" hidden>Twitch ile yaz</button>
        <button type="button" class="btn kick" id="kickWrite">Kick ile yaz</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
  </section>
</main>
<script>
(function(){
  'use strict';
  // ---- channel facts -------------------------------------------------------
  var TWITCH_LOGIN = 'kaptanqedy', TWITCH_ID = '146047709';
  var KICK_SLUG = 'kaptanqedy', KICK_CHATROOM = 2435281, KICK_CHANNEL = 2442803;
  var KICK_PUSHER = 'wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0&flash=false';
  // Twitch app (dev.twitch.tv · public client, redirect = this page). Empty = writing via Twitch stays off.
  var TWITCH_CLIENT_ID = 'jbfsymcho9cziqpi1cd1vhoowkfql8';
  var SCOPES = ['chat:read', 'chat:edit'], OPTIONAL_SCOPES = ['user:read:emotes'];
  var host = location.hostname || 'ertugrul-tug.github.io';
  // must equal the OAuth Redirect URL registered for the Twitch app
  var REDIRECT = /github\.io$/.test(host) ? 'https://ertugrul-tug.github.io/stream-library/izle/' : location.origin + location.pathname;

  function $(id){ return document.getElementById(id); }
  function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---- player --------------------------------------------------------------
  var SRC = {
    twitch: 'https://player.twitch.tv/?channel=' + TWITCH_LOGIN + '&parent=' + host + '&autoplay=true',
    kick: 'https://player.kick.com/' + KICK_SLUG + '?autoplay=true'
  };
  function pick(p){
    var f = document.createElement('iframe');
    f.src = SRC[p]; f.title = (p === 'twitch' ? 'Twitch' : 'Kick') + ' yayını';
    f.allow = 'autoplay; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    $('player').replaceChildren(f);
    document.querySelectorAll('.switch button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.p === p)); });
    store('qedy-izle-player', p);
  }
  document.querySelectorAll('.switch button').forEach(function(b){ b.addEventListener('click', function(){ pick(b.dataset.p); }); });
  pick(store('qedy-izle-player') === 'kick' ? 'kick' : 'twitch');

  // ---- unified chat --------------------------------------------------------
  var box = $('msgs'), MAX = 200, stick = true;
  box.addEventListener('scroll', function(){
    stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    if (stick) $('jump').classList.remove('on');
  });
  $('jump').addEventListener('click', function(){ box.scrollTop = box.scrollHeight; });

  // The captain's account (and the bot speaking through it) posts the same line to both chats:
  // show the Twitch copy, drop the Kick copy if Twitch said the same within 20 s.
  var capTwitch = [], capKickWaiting = [];
  function norm(t){ return String(t || '').replace(/\[emote:\d+:[^\]]*\]/g, '').replace(/\s+/g, ' ').trim().toLowerCase(); }
  function isCaptain(name){ return String(name || '').toLowerCase() === TWITCH_LOGIN; }
  function seenOnTwitch(text){
    var now = Date.now(), n = norm(text);
    capTwitch = capTwitch.filter(function(x){ return now - x.at < 20000; });
    return capTwitch.some(function(x){ return x.text === n; });
  }

  function add(m){
    if ($('empty')) $('empty').remove();
    var row = document.createElement('div');
    row.className = 'msg' + (m.mine ? ' mine' : '');
    row.dataset.platform = m.platform; row.dataset.user = (m.name || '').toLowerCase();
    if (m.id) row.dataset.id = m.id;
    var av = document.createElement('img'); av.className = 'av'; av.alt = ''; av.hidden = true;
    av.onload = function(){ av.hidden = false; }; av.onerror = function(){ av.remove(); };
    avatar(m.platform, m.name, m.slug).then(function(url){ if (url) av.src = url; else av.remove(); });
    row.append(av);
    var pf = document.createElement('span'); pf.className = 'pf ' + m.platform; pf.textContent = m.platform === 'twitch' ? 'T' : 'K';
    pf.title = m.platform === 'twitch' ? 'Twitch' : 'Kick';
    var who = document.createElement('span'); who.className = 'who'; who.textContent = m.name; who.style.color = m.color || (m.platform === 'twitch' ? '#bf94ff' : '#7dff57');
    row.append(pf, who);
    if (isCaptain(m.name)) { var cap = document.createElement('span'); cap.className = 'cap'; cap.textContent = 'KAPTAN'; row.append(cap); }
    row.append(document.createTextNode(': '));
    m.parts.forEach(function(p){
      if (p.img) { var i = document.createElement('img'); i.className = 'emote'; i.src = p.img; i.alt = p.text; i.title = p.text; i.loading = 'lazy'; row.append(i); }
      else row.append(document.createTextNode(p.text));
    });
    box.append(row);
    while (box.children.length > MAX) box.firstElementChild.remove();
    if (stick) box.scrollTop = box.scrollHeight; else $('jump').classList.add('on');
  }
  function removeWhere(fn){ Array.prototype.slice.call(box.children).forEach(function(r){ if (r.classList.contains('msg') && fn(r)) r.remove(); }); }

  // Twitch: anonymous IRC over WebSocket (read-only, no login)
  function twitchParts(text, emotes){
    var chars = Array.from(text), marks = [];
    (emotes || '').split('/').forEach(function(e){
      if (!e) return; var bits = e.split(':'), id = bits[0];
      (bits[1] || '').split(',').forEach(function(r){ var ab = r.split('-'); marks.push({ a: +ab[0], b: +ab[1], id: id }); });
    });
    marks.sort(function(x, y){ return x.a - y.a; });
    var parts = [], pos = 0;
    marks.forEach(function(k){
      if (k.a > pos) parts.push({ text: chars.slice(pos, k.a).join('') });
      parts.push({ text: chars.slice(k.a, k.b + 1).join(''), img: 'https://static-cdn.jtvnw.net/emoticons/v2/' + k.id + '/default/dark/2.0' });
      pos = k.b + 1;
    });
    if (pos < chars.length) parts.push({ text: chars.slice(pos).join('') });
    return parts;
  }
  function parseTags(s){ var o = {}; s.split(';').forEach(function(kv){ var i = kv.indexOf('='); o[kv.slice(0, i)] = kv.slice(i + 1).replace(/\\s/g, ' ').replace(/\\:/g, ';').replace(/\\\\/g, '\\'); }); return o; }
  function parseIrc(line){
    var tags = {}, rest = line;
    if (rest[0] === '@') { var sp = rest.indexOf(' '); tags = parseTags(rest.slice(1, sp)); rest = rest.slice(sp + 1); }
    var m = rest.match(/^:(\S+?)(?:!\S+)? (\S+) #\S+(?: :(.*))?$/);
    if (!m) return { raw: rest };
    var text = m[3] || '';
    if (/^\u0001ACTION /.test(text)) text = text.replace(/^\u0001ACTION /, '').replace(/\u0001$/, '');
    return { tags: tags, nick: m[1], cmd: m[2], text: text };
  }
  function twitchMsg(p){
    var name = p.tags['display-name'] || p.nick;
    return { platform: 'twitch', id: p.tags.id, name: name, color: p.tags.color, text: p.text, at: +p.tags['tmi-sent-ts'] || Date.now(),
             parts: twitchParts(p.text, p.tags.emotes), mine: !!(me && p.tags['user-id'] === me.id) };
  }
  var twitchSeen = {};
  var twitchDelay = 1000;
  function twitchConnect(){
    var ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
    ws.onopen = function(){
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands'); ws.send('PASS SCHMOOPIIE');
      ws.send('NICK justinfan' + (10000 + Math.floor(Math.random() * 80000))); ws.send('JOIN #' + TWITCH_LOGIN);
    };
    ws.onmessage = function(ev){
      String(ev.data).split('\r\n').forEach(function(line){
        if (!line) return;
        if (line.indexOf('PING') === 0) { ws.send('PONG :tmi.twitch.tv'); return; }
        var p = parseIrc(line);
        if (!p.cmd) { if (/ 366 /.test(p.raw)) { $('connT').classList.add('on'); twitchDelay = 1000; } return; }
        var tags = p.tags, cmd = p.cmd, text = p.text;
        if (cmd === 'PRIVMSG') {
          var tm = twitchMsg(p);
          if (tm.id && twitchSeen[tm.id]) return;
          if (tm.id) twitchSeen[tm.id] = 1;
          if (isCaptain(tm.name)) capTwitch.push({ text: norm(text), at: Date.now() }), flushKickWaiting();
          add(tm);
        } else if (cmd === 'CLEARMSG') {
          removeWhere(function(r){ return r.dataset.id === tags['target-msg-id']; });
        } else if (cmd === 'CLEARCHAT' && text) {
          var user = text.toLowerCase(); removeWhere(function(r){ return r.dataset.platform === 'twitch' && r.dataset.user === user; });
        }
      });
    };
    ws.onclose = function(){ $('connT').classList.remove('on'); setTimeout(twitchConnect, twitchDelay); twitchDelay = Math.min(30000, twitchDelay * 2); };
  }

  // Kick: public chat feed (Pusher), read-only
  function kickParts(text){
    var parts = [], re = /\[emote:(\d+):([^\]]*)\]/g, last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) parts.push({ text: text.slice(last, m.index) });
      parts.push({ text: m[2], img: 'https://files.kick.com/emotes/' + m[1] + '/fullsize' });
      last = re.lastIndex;
    }
    if (last < text.length) parts.push({ text: text.slice(last) });
    return parts;
  }
  function kickShow(d){
    var s = d.sender || {}, color = (s.identity || {}).color;
    add({ platform: 'kick', id: d.id, name: s.username || 'kick', slug: s.slug, color: color, parts: kickParts(String(d.content || '')) });
  }
  function flushKickWaiting(){
    capKickWaiting = capKickWaiting.filter(function(w){ if (seenOnTwitch(w.d.content)) { clearTimeout(w.timer); return false; } return true; });
  }
  var kickDelay = 1000, kickSeen = {};
  function kickConnect(){
    var ws = new WebSocket(KICK_PUSHER);
    ws.onmessage = function(ev){
      var m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (m.event === 'pusher:connection_established') {
        ['chatrooms.' + KICK_CHATROOM + '.v2', 'chatroom_' + KICK_CHATROOM].forEach(function(ch){
          ws.send(JSON.stringify({ event: 'pusher:subscribe', data: { auth: '', channel: ch } }));
        });
        $('connK').classList.add('on'); kickDelay = 1000; return;
      }
      if (m.event === 'pusher:ping') { ws.send(JSON.stringify({ event: 'pusher:pong', data: {} })); return; }
      var d; try { d = typeof m.data === 'string' ? JSON.parse(m.data) : m.data; } catch (e) { return; }
      if (/ChatMessage/.test(m.event || '')) {
        if (!d || !d.id || kickSeen[d.id]) return;  // both subscriptions can deliver the same message
        kickSeen[d.id] = 1;
        if (isCaptain((d.sender || {}).username)) {
          if (seenOnTwitch(d.content)) return;
          var w = { d: d }; w.timer = setTimeout(function(){ capKickWaiting = capKickWaiting.filter(function(x){ return x !== w; }); kickShow(d); }, 4000);
          capKickWaiting.push(w); return;
        }
        kickShow(d);
      } else if (/MessageDeleted/.test(m.event || '') && d && d.message) {
        removeWhere(function(r){ return r.dataset.id === String(d.message.id); });
      } else if (/UserBanned/.test(m.event || '') && d && d.user) {
        var u = String(d.user.username || '').toLowerCase(); removeWhere(function(r){ return r.dataset.platform === 'kick' && r.dataset.user === u; });
      }
    };
    ws.onclose = function(){ $('connK').classList.remove('on'); setTimeout(kickConnect, kickDelay); kickDelay = Math.min(30000, kickDelay * 2); };
  }

  // ---- writing via Twitch (viewer's own account, implicit OAuth) ----------
  var me = null;
  function status(text, err){ var s = $('status'); s.textContent = text || ''; s.classList.toggle('err', !!err); }
  function showLogin(){
    $('whoRow').hidden = !me; $('sendRow').hidden = !me;
    $('login').hidden = !!me || !TWITCH_CLIENT_ID;
    $('loginRow').hidden = false;
    if (me) $('whoName').textContent = me.login;
  }
  function takeToken(){
    if (!location.hash || location.hash.indexOf('access_token=') < 0) return;
    var q = new URLSearchParams(location.hash.slice(1));
    var expected = null; try { expected = sessionStorage.getItem('qedy-oauth-state'); } catch (e) {}
    history.replaceState(null, '', location.pathname + location.search);
    if (!expected || q.get('state') !== expected) { status('Giriş doğrulanamadı, tekrar dene.', true); return; }
    store('qedy-twitch-token', q.get('access_token'));
  }
  function validate(){
    var token = store('qedy-twitch-token');
    if (!token || !TWITCH_CLIENT_ID) { showLogin(); return; }
    fetch('https://id.twitch.tv/oauth2/validate', { headers: { Authorization: 'OAuth ' + token } })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        var ok = v && v.user_id && SCOPES.every(function(sc){ return (v.scopes || []).indexOf(sc) >= 0; });
        if (ok) { me = { id: v.user_id, login: v.login, token: token, scopes: v.scopes || [] }; writerConnect(); flushTwitchAvatars(); }
        else { store('qedy-twitch-token', null); me = null; if (v && v.user_id) status('Yazma izni güncellendi, bir kez tekrar "Twitch ile yaz"a bas.'); }
        showLogin();
      }).catch(showLogin);
  }
  $('login').addEventListener('click', function(){
    var st = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { sessionStorage.setItem('qedy-oauth-state', st); } catch (e) {}
    location.href = 'https://id.twitch.tv/oauth2/authorize?' + new URLSearchParams({
      client_id: TWITCH_CLIENT_ID, redirect_uri: REDIRECT, response_type: 'token', scope: SCOPES.concat(OPTIONAL_SCOPES).join(' '), state: st, force_verify: 'false'
    });
  });
  $('logout').addEventListener('click', function(){
    if (me) fetch('https://id.twitch.tv/oauth2/revoke', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ client_id: TWITCH_CLIENT_ID, token: me.token }) }).catch(function(){});
    store('qedy-twitch-token', null); me = null; if (writer) writer.ws.close(); showLogin(); status('');
  });
  // The viewer's own IRC connection, used only for sending (reading stays on the anonymous one).
  var writer = null;
  var NOTICES = {
    msg_followersonly: 'Sohbet takipçi modunda: önce kanalı takip etmelisin.',
    msg_followersonly_followed: 'Takipçi modunda yazabilmek için biraz daha beklemelisin.',
    msg_subsonly: 'Sohbet abone modunda.',
    msg_emoteonly: 'Sohbet yalnızca emote modunda.',
    msg_slowmode: 'Yavaş mod açık, biraz bekleyip tekrar dene.',
    msg_duplicate: 'Aynı mesajı az önce gönderdin.',
    msg_ratelimit: 'Çok hızlı yazıyorsun, birkaç saniye bekle.',
    msg_banned: 'Bu kanalda yazman engellenmiş.',
    msg_timedout: 'Şu an susturulmuşsun.',
    msg_verified_email: 'Yazmak için Twitch hesabında e-posta doğrulaması gerekiyor.',
    msg_requires_verified_phone_number: 'Yazmak için Twitch hesabında telefon doğrulaması gerekiyor.'
  };
  function writerConnect(){
    if (!me || writer) return;
    var ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443'), w = { ws: ws, ready: false };
    writer = w;
    ws.onopen = function(){
      ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
      ws.send('PASS oauth:' + me.token); ws.send('NICK ' + me.login); ws.send('JOIN #' + TWITCH_LOGIN);
    };
    ws.onmessage = function(ev){
      String(ev.data).split('\r\n').forEach(function(line){
        if (!line) return;
        if (line.indexOf('PING') === 0) { ws.send('PONG :tmi.twitch.tv'); return; }
        if (/ 366 /.test(line)) { w.ready = true; $('send').disabled = false; return; }
        if (/NOTICE \* :Login (authentication failed|unsuccessful)/.test(line) || /Improperly formatted auth/.test(line)) {
          store('qedy-twitch-token', null); me = null; showLogin(); status('Twitch oturumu geçersiz, tekrar giriş yap.', true); ws.close(); return;
        }
        var p = parseIrc(line);
        if (p.cmd === 'NOTICE') status(NOTICES[p.tags['msg-id']] || p.text, true);
      });
    };
    ws.onclose = function(){ if (writer === w) writer = null; if (me) setTimeout(writerConnect, 3000); };
  }
  function send(){
    var input = $('text'), text = input.value.replace(/[\r\n]+/g, ' ').trim();
    if (!me || !text) return;
    if (!writer || !writer.ready) { status('Twitch sohbetine bağlanıyor, bir saniye…'); writerConnect(); return; }
    writer.ws.send('PRIVMSG #' + TWITCH_LOGIN + ' :' + text);
    input.value = ''; status(''); input.focus();
  }
  $('send').addEventListener('click', send);
  $('text').addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); send(); } });
  // Kick has no sign-in we can drive from a static page, so its own chat opens inline (log in inside it, no new tab).
  $('kickWrite').addEventListener('click', function(){
    var box = $('kickBox');
    if (!box.querySelector('iframe')) {
      var f = document.createElement('iframe');
      f.src = 'https://kick.com/popout/' + KICK_SLUG + '/chat'; f.title = 'Kick sohbeti';
      box.prepend(f);
    }
    box.classList.toggle('open', store('qedy-kick-small') !== '1');  // first time: full size so the login form is visible
    kickSync(); box.hidden = false;
  });
  function kickSync(){ $('kickGrow').textContent = $('kickBox').classList.contains('open') ? '⤡ Küçült' : '⤢ Giriş için büyüt'; }
  $('kickGrow').addEventListener('click', function(){ store('qedy-kick-small', $('kickBox').classList.toggle('open') ? '0' : '1'); kickSync(); });
  $('kickClose').addEventListener('click', function(){ $('kickBox').hidden = true; });


  // ---- profile pictures (cached a day per user in this browser) ----------------
  var AV_KEY = 'qedy-avatars', avCache = {}, avPending = {}, twitchQueue = {};
  try { avCache = JSON.parse(store(AV_KEY) || '{}') || {}; } catch (e) { avCache = {}; }
  function avSave(){
    var keys = Object.keys(avCache);
    if (keys.length > 400) keys.sort(function(a, b){ return avCache[a][1] - avCache[b][1]; }).slice(0, keys.length - 400).forEach(function(k){ delete avCache[k]; });
    store(AV_KEY, JSON.stringify(avCache));
  }
  function avatar(platform, name, slug){
    var key = platform + ':' + String(name || '').toLowerCase();
    var hit = avCache[key];
    if (hit && Date.now() - hit[1] < 86400000) return Promise.resolve(hit[0]);
    if (avPending[key]) return avPending[key];
    var job;
    if (platform === 'kick') {
      job = fetch('https://kick.com/api/v2/channels/' + encodeURIComponent(slug || String(name).toLowerCase()))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ return (j && j.user && j.user.profile_pic) || ''; });
    } else {
      job = new Promise(function(res){ (twitchQueue[String(name).toLowerCase()] = twitchQueue[String(name).toLowerCase()] || []).push(res); scheduleTwitchAvatars(); });
    }
    avPending[key] = job.catch(function(){ return ''; }).then(function(url){
      delete avPending[key]; avCache[key] = [url, Date.now()]; avSave(); return url;
    });
    return avPending[key];
  }
  var twitchTimer = null;
  function scheduleTwitchAvatars(){ if (!twitchTimer) twitchTimer = setTimeout(flushTwitchAvatars, 400); }
  function flushTwitchAvatars(){
    twitchTimer = null;
    var logins = Object.keys(twitchQueue);
    if (!logins.length) return;
    var batch = logins.slice(0, 100), waiting = {};
    batch.forEach(function(l){ waiting[l] = twitchQueue[l]; delete twitchQueue[l]; });
    var answer = function(map){ batch.forEach(function(l){ waiting[l].forEach(function(res){ res(map[l] || ''); }); }); };
    if (me && TWITCH_CLIENT_ID) {
      // logged in: one Helix call for up to 100 users
      fetch('https://api.twitch.tv/helix/users?' + batch.map(function(l){ return 'login=' + encodeURIComponent(l); }).join('&'),
        { headers: { Authorization: 'Bearer ' + me.token, 'Client-Id': TWITCH_CLIENT_ID } })
        .then(function(r){ return r.ok ? r.json() : { data: [] }; })
        .then(function(j){ var map = {}; (j.data || []).forEach(function(u){ map[u.login] = u.profile_image_url; }); answer(map); })
        .catch(function(){ answer({}); });
    } else {
      // anonymous: a public lookup per user
      Promise.all(batch.map(function(l){
        return fetch('https://decapi.me/twitch/avatar/' + encodeURIComponent(l)).then(function(r){ return r.ok ? r.text() : ''; })
          .then(function(t){ return [l, /^https:\/\//.test(t.trim()) ? t.trim() : '']; }).catch(function(){ return [l, '']; });
      })).then(function(pairs){ var map = {}; pairs.forEach(function(p){ map[p[0]] = p[1]; }); answer(map); });
    }
    if (Object.keys(twitchQueue).length) scheduleTwitchAvatars();
  }

  // ---- emote picker (Twitch emotes the viewer can use) -----------------------
  var emoteSets = null;
  function helix(path){
    return fetch('https://api.twitch.tv/helix/' + path, { headers: { Authorization: 'Bearer ' + me.token, 'Client-Id': TWITCH_CLIENT_ID } })
      .then(function(r){ return r.ok ? r.json() : { data: [] }; });
  }
  function emoteImg(e, template){
    var t = template || 'https://static-cdn.jtvnw.net/emoticons/v2/{{id}}/{{format}}/{{theme_mode}}/{{scale}}';
    var fmt = (e.format || []).indexOf('animated') >= 0 ? 'animated' : 'static';
    return t.replace('{{id}}', e.id).replace('{{format}}', fmt).replace('{{theme_mode}}', 'dark').replace('{{scale}}', '1.0');
  }
  function loadEmotes(){
    if (emoteSets) return Promise.resolve(emoteSets);
    var sets = [];
    var own = (me.scopes || []).indexOf('user:read:emotes') >= 0;
    function userPage(cursor, acc){
      return helix('chat/emotes/user?user_id=' + me.id + (cursor ? '&after=' + cursor : '')).then(function(j){
        acc = acc.concat((j.data || []).map(function(e){ e.img = emoteImg(e, j.template); return e; }));
        return j.pagination && j.pagination.cursor && acc.length < 3000 ? userPage(j.pagination.cursor, acc) : acc;
      });
    }
    var job = own
      ? userPage('', []).then(function(all){
          var chan = all.filter(function(e){ return e.owner_id === TWITCH_ID; });
          var glob = all.filter(function(e){ return e.emote_type === 'globals' || e.owner_id === '0'; });
          var other = all.filter(function(e){ return chan.indexOf(e) < 0 && glob.indexOf(e) < 0; });
          sets = [['KAPTAN QEDY', chan], ['DİĞER KANALLAR', other], ['TWITCH', glob]];
        })
      : Promise.all([helix('chat/emotes?broadcaster_id=' + TWITCH_ID), helix('chat/emotes/global')]).then(function(r){
          sets = [['KAPTAN QEDY', (r[0].data || []).map(function(e){ e.img = emoteImg(e, r[0].template); return e; })],
                  ['TWITCH', (r[1].data || []).map(function(e){ e.img = emoteImg(e, r[1].template); return e; })]];
        });
    return job.then(function(){ emoteSets = sets.filter(function(x){ return x[1].length; }); return emoteSets; });
  }
  function drawEmotes(){
    var grid = $('emoteGrid'), q = $('emoteSearch').value.trim().toLowerCase();
    grid.replaceChildren();
    if (!emoteSets) { var w = document.createElement('p'); w.className = 'hint'; w.textContent = 'Emote\'lar yükleniyor…'; grid.append(w); return; }
    var shown = 0;
    emoteSets.forEach(function(set){
      var list = set[1].filter(function(e){ return !q || e.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 300);
      if (!list.length) return;
      var h = document.createElement('h4'); h.textContent = set[0]; grid.append(h);
      var box = document.createElement('div'); box.className = 'set';
      list.forEach(function(e){
        var b = document.createElement('button'); b.type = 'button'; b.title = e.name; b.setAttribute('aria-label', e.name);
        var i = document.createElement('img'); i.src = e.img; i.alt = e.name; i.loading = 'lazy'; b.append(i);
        b.addEventListener('click', function(){ insertEmote(e.name); });
        box.append(b); shown++;
      });
      grid.append(box);
    });
    if (!shown) { var n = document.createElement('p'); n.className = 'hint'; n.textContent = q ? 'Bu isimde emote yok.' : 'Kullanabileceğin emote bulunamadı.'; grid.append(n); }
  }
  function insertEmote(name){
    var input = $('text'), at = input.selectionStart == null ? input.value.length : input.selectionStart;
    var before = input.value.slice(0, at), after = input.value.slice(input.selectionEnd || at);
    var add = (before && !/\s$/.test(before) ? ' ' : '') + name + ' ';
    input.value = (before + add + after).slice(0, 450);
    input.focus(); var pos = (before + add).length; input.setSelectionRange(pos, pos);
  }
  function togglePicker(open){
    var pk = $('picker'), show = open === undefined ? pk.hidden : open;
    pk.hidden = !show;
    if (show) { drawEmotes(); loadEmotes().then(drawEmotes).catch(function(){ emoteSets = []; drawEmotes(); }); $('emoteSearch').focus(); }
  }
  $('emoteBtn').addEventListener('click', function(){ togglePicker(); });
  $('emoteSearch').addEventListener('input', drawEmotes);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !$('picker').hidden) togglePicker(false); });
  document.addEventListener('click', function(e){
    if (!$('picker').hidden && !$('picker').contains(e.target) && e.target !== $('emoteBtn')) togglePicker(false);
  });

  // ---- live dot --------------------------------------------------------------
  function checkLive(){
    fetch('https://decapi.me/twitch/uptime/' + TWITCH_LOGIN, { cache: 'no-store' }).then(function(r){ return r.ok ? r.text() : ''; }).then(function(t){
      $('live').classList.toggle('on', !!t && !/offline|error|not found/i.test(t));
    }).catch(function(){});
  }

  // ---- history: the page never opens empty --------------------------------
  function timeout(ms){ return new Promise(function(res){ setTimeout(function(){ res(null); }, ms); }); }
  function loadHistory(){
    var tw = Promise.race([fetch('https://recent-messages.robotty.de/api/v2/recent-messages/' + TWITCH_LOGIN + '?limit=40')
      .then(function(r){ return r.json(); }), timeout(4000)]).then(function(j){
        return ((j && j.messages) || []).map(parseIrc).filter(function(p){ return p.cmd === 'PRIVMSG'; }).map(twitchMsg);
      }).catch(function(){ return []; });
    var kk = Promise.race([fetch('https://kick.com/api/v2/channels/' + KICK_CHANNEL + '/messages')
      .then(function(r){ return r.json(); }), timeout(4000)]).then(function(j){
        return (((j && j.data) || {}).messages || []).filter(function(d){ return d.type === 'message'; })
          .map(function(d){ return { platform: 'kick', d: d, at: Date.parse(d.created_at) || 0 }; });
      }).catch(function(){ return []; });
    return Promise.all([tw, kk]).then(function(res){
      var t = res[0], k = res[1];
      var caps = t.filter(function(m){ return isCaptain(m.name); }).map(function(m){ return { text: norm(m.text), at: m.at }; });
      k = k.filter(function(x){
        return !(isCaptain((x.d.sender || {}).username) && caps.some(function(c){ return c.text === norm(x.d.content) && Math.abs(c.at - x.at) < 20000; }));
      });
      t.concat(k).sort(function(a, b){ return a.at - b.at; }).slice(-60).forEach(function(x){
        if (x.platform === 'kick') { kickSeen[x.d.id] = 1; kickShow(x.d); }
        else { if (x.id) twitchSeen[x.id] = 1; add(x); }
      });
    });
  }

  takeToken(); validate();
  loadHistory().then(function(){ twitchConnect(); kickConnect(); });
  checkLive(); setInterval(function(){ if (!document.hidden) checkLive(); }, 60000);
})();
</script>
</body>
